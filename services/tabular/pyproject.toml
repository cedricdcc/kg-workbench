[project]
name = "kg-workbench-tabular"
version = "0.1.0"
description = "DuckDB tabular ingestion and analytical profiling microservice for KG Workbench"
license = "MIT"
requires-python = ">=3.11,<3.14"
dependencies = [
  "cryptography>=42.0.0",
  "duckdb>=1.1.0",
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "openpyxl>=3.1.5",
  "pyarrow>=17.0.0",
  "pydantic>=2.8.0",
  "pytz>=2024.1",
  "python-multipart>=0.0.12",
  "uvicorn[standard]>=0.32.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tabular"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

