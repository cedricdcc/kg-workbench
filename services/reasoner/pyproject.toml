[project]
name = "kg-workbench-reasoner"
version = "0.1.0"
description = "Oxigraph and SHACL reasoning microservice for KG Workbench"
license = "MIT"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "pydantic>=2.8.0",
  "pyoxigraph>=0.4.0",
  "pyshacl>=0.29.0",
  "rdflib>=7.1.0",
  "uvicorn[standard]>=0.32.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reasoner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

